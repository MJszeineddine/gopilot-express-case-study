name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation set
        run: |
          test -s README.md
          test -s docs/architecture.md
          test -s docs/features.md
          test -s docs/engineering-decisions.md
          test -s docs/quality-and-delivery.md
          test -s SECURITY.md
          test -s LICENSE
          ! find . -name ".env" -o -name ".env.*" | grep .
